# nginx 本机/Windows 部署配置（完整文件，直接当 nginx.conf 用）
# 用法见 README「Nginx 反向代理」：nginx.exe -p <nginx目录> -c conf/nginx.windows.conf
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/wasm;

  # 后端地址：Spring Boot 默认 127.0.0.1:8080（application.yml 的 server.port）
  upstream kaoyan_backend {
    server 127.0.0.1:8080;
    keepalive 16;
  }

  server {
    listen 80;
    server_name localhost;
    # npm run build 的产物目录，按实际路径修改
    root "D:/UniversityAIUserPage/UniversityAIUserPage/dist";
    index index.html;
    # 后端 multipart 上限 10MB，留出封装余量
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite 产物带内容哈希，可长期缓存
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # vue-router history 模式：刷新任意前端路由都回退到 index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # SSE：必须关闭缓冲并放长读超时，否则 /api/v1/events 会攒包或被 60 秒掐断
    location = /api/v1/events {
      proxy_pass http://kaoyan_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 30m;
      proxy_send_timeout 30m;
    }

    location /api/ {
      # 不加末尾 /：保留 /api/v1/... 完整路径
      proxy_pass http://kaoyan_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      # 附件上传流式转发，避免先落盘再转发
      proxy_request_buffering off;
    }
  }
}